<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEESIDE AUTO — Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">DEESIDE AUTO — ADMIN</div>
</header>

<main style="padding: 120px 5% 60px; min-height: 100vh;">

    <section id="login-section">
        <h2>Admin Login</h2>

        <form id="admin-login">
            <input
                type="email"
                id="admin-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p id="login-message"></p>
        </form>
    </section>


    <section id="admin-panel" style="display:none;">

        <button id="logout-button">Logout</button>

        <h2>Bookings</h2>
       <div id="booking-stats" style="display:flex; gap:15px; margin-bottom:25px; flex-wrap:wrap;">
    Pending: 0 | Accepted: 0 | Rejected: 0
</div>

        <div id="booking-list">
            Loading bookings...
        </div>


        <h2 style="margin-top:60px;">Reviews</h2>

        <div id="review-list">
            Loading reviews...
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>
</html>
